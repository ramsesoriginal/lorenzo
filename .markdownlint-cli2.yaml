config:
  default: true
  MD013: false # line-length - this repo writes long prose lines, not hard-wrapped
  MD024: # no-duplicate-heading
    siblings_only: true # lets docs covering multiple apps repeat headings like "Production" per app, one level up
  MD033: false # inline HTML - not used deliberately, but no reason to forbid it
  MD041: false # first-line-must-be-h1 - not guaranteed for every file going forward
