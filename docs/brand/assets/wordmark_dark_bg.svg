  aria-labelledby="lorenzo-wordmark-dark-title lorenzo-wordmark-dark-desc"
>
  <title id="lorenzo-wordmark-dark-title">Lorenzo custom wordmark, dark-background version</title>
  <desc id="lorenzo-wordmark-dark-desc">
    The Lorenzo custom vector wordmark optimized for dark backgrounds: Paper lettering
    with the unshaded Medici Gold spark brand mark centered below, on a transparent background.
  </desc>

  <!--
    LORENZO / CUSTOM WORDMARK / DARK-BACKGROUND LOCKUP
    ==================================================

    Intent:
    - preserve the exact approved wordmark geometry and spacing
    - create the official reversed-color version for dark backgrounds
    - keep the support spark as the exact original, unshaded brand mark

    Color system:
    - lettering: Paper       #FBFAF7
    - support mark: Medici Gold #B88A3B
    - background: transparent (intended for use on dark surfaces)

    Technical notes:
    - all artwork is vector outlines, no live text
    - repeated glyphs are reused through <defs> and <use>
    - no filters, gradients, masks, or raster assets
    - suitable for digital and print workflows
  -->

  <defs>
    <style>
      .lorenzo-word-fill { fill: #FBFAF7; }
      .lorenzo-mark-fill { fill: #B88A3B; }
    </style>

