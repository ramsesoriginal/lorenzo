monorepo_root = true

[monorepo]
config_roots = ["apps/account-hub", "apps/api", "apps/beings", "apps/bench", "apps/cli", "apps/inventory-web", "apps/inventory-mobile", "apps/loot-bot", "apps/brand", "packages/api-client", "packages/brand", "packages/converters", "packages/inventory-names", "packages/lorenzoscript", "packages/lorenzoscript-editor", "packages/stat-values", "packages/information-editor"]

[tools]
node = "26"
uv = "0.12.3"

# Python itself is deliberately not listed here - it's controlled by uv
# (see apps/api/.python-version), not mise. mise still provides uv itself.

# Future toolchains, added here once those apps actually start:
# ruby = "3.4"
# kotlin = "2.1"
# dotnet = "9"

# `//...:x` (Bazel-style "everything under here") also matches this file's
# own `//:x` task, since the root project is part of "everything" - so it
# recursed into itself infinitely instead of fanning out. `//apps/...:x`/
# `//packages/...:x` scope the glob to actual sub-projects instead.

[env]
PUBLIC_AUTHGEAR_CLIENT_ID = "1923bf4e48a6c7ab" # public, no problem to be committed
PUBLIC_AUTHGEAR_ENDPOINT = "https://lorenzo.authgear.cloud"
AUTHGEAR_DEV_CLIENT_ID = "1923bf4e48a6c7ab"    # public, no problem to be committed
AUTHGEAR_ISSUER = "https://lorenzo.authgear.cloud"
AUTHGEAR_JWKS_URL = "https://lorenzo.authgear.cloud/oauth2/jwks"
AUTHGEAR_AUDIENCE = "https://lorenzo.authgear.cloud"
REGION = "europe-west1"
LOOT_BOT_URL = "https://lorenzo-loot-bot-inkhankc2a-ew.a.run.app"

[tasks.dev]
description = "Run every app's dev task"
run = ["mise run '//apps/...:dev'", "mise run '//packages/...:dev'"]

[tasks.lint]
description = "Lint everything (fans out to every app)"
run = ["mise run '//apps/...:lint'", "mise run '//packages/...:lint'"]

[tasks.format]
description = "Format everything (fans out to every app)"
run = ["mise run '//apps/...:format'", "mise run '//packages/...:format'"]

[tasks.test]
description = "Test everything (fans out to every app)"
run = ["mise run '//apps/...:test'", "mise run '//packages/...:test'"]

[tasks.check]
description = "Full pre-PR gate: lint (incl. type check) + test, everything"
depends = ["lint", "test"]
