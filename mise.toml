monorepo_root = true

[monorepo]
config_roots = ["apps/api", "apps/inventory-web"]

[tools]
node = "22"
uv = "0.12.3"
# mise doesn't enable corepack by default (no [hooks] postinstall wired up
# for it), so a plain `packageManager` field in apps/inventory-web's
# package.json wouldn't actually get honored in CI - managing pnpm
# directly here is the reliable option, and keeps every toolchain pin in
# the one place this repo already looks for them. Same version pinned in
# apps/inventory-web/package.json's own `packageManager` field, for tools
# (editors, `corepack` itself) that only look there.
pnpm = "12.4.2"

# Python itself is deliberately not listed here - it's controlled by uv
# (see apps/api/.python-version), not mise. mise still provides uv itself.

# Future toolchains, added here once those apps actually start:
# ruby = "3.4"
# kotlin = "2.1"
# dotnet = "9"

# `//...:x` (Bazel-style "everything under here") also matches this file's
# own `//:x` task, since the root project is part of "everything" - so it
# recursed into itself infinitely instead of fanning out. `//apps/...:x`
# scopes the glob to actual sub-projects instead. Extend to
# `//packages/...:x` too once packages/* exists (see
# docs/guides/adding-a-package.md) - omitted for now because mise errors on
# a glob that matches zero tasks.
[tasks.dev]
description = "Run every app's dev task"
run = "mise run '//apps/...:dev'"

[tasks.lint]
description = "Lint everything (fans out to every app)"
run = "mise run '//apps/...:lint'"

[tasks.format]
description = "Format everything (fans out to every app)"
run = "mise run '//apps/...:format'"

[tasks.test]
description = "Test everything (fans out to every app)"
run = "mise run '//apps/...:test'"

[tasks.check]
description = "Full pre-PR gate: lint (incl. type check) + test, everything"
depends = ["lint", "test"]
