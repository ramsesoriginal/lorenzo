name: lorenzo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lorenzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lorenzo}
      POSTGRES_DB: ${POSTGRES_DB:-lorenzo}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lorenzo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
