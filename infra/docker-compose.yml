services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lorenzo
      POSTGRES_USER: lorenzo
      POSTGRES_PASSWORD: lorenzo_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorenzo"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lorenzo
      RABBITMQ_DEFAULT_PASS: lorenzo_dev
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      retries: 5

volumes:
  pgdata:
