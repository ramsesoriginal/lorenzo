name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false # queue, never race two runs mutating the same release PR/branch

permissions:
  contents: write
  pull-requests: write

# Pinned mise, same reason and bump rule as in ci.yml.
env:
  MISE_VERSION: "2026.9.15"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please's release commit only bumps pyproject.toml (+
  # CHANGELOG.md + the manifest) - never uv.lock, which separately records
  # the local project's own version too, so every bump leaves it stale
  # (confirmed twice now: the 0.2.0 release and the 0.3.0 one). uv lock
  # --check (apps/api/mise.toml's lint task) correctly catches this in CI
  # but can't fix it. Hardcoded to the uv projects below, not generalized over the
  # manifest's packages - same reasoning as ci.yml's openapi-diff job: a future
  # package might not even use uv. apps/api and apps/cli have a step each; the three
  # Python packages share the last one.
  sync-lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
          # Deliberately not GITHUB_TOKEN: a GITHUB_TOKEN-authored push to
          # release-please's own PR branch only creates an
          # "approval-required" pull_request run (GitHub's recursion
          # guard for GITHUB_TOKEN-driven PR updates) - this PAT is an
          # ordinary push as far as Actions is concerned, so the CI run
          # it triggers on this fix-up commit starts immediately, same as
          # any human push would.
          token: ${{ secrets.RELEASE_PLEASE_PUSH_TOKEN }}
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Regenerate uv.lock if the version bump left it stale
        working-directory: apps/api
        # actions/checkout leaves a ref-by-branch-name checkout in
        # detached HEAD (confirmed against its own docs) - a bare `git
        # push` has no branch to push to from there, so the target
        # branch is passed through an env var and pushed by explicit
        # refspec instead of interpolating the expression into the shell
        # script directly.
        env:
          PR_BRANCH: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
        run: |
          mise run lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(api): sync uv.lock with release-please's version bump"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
      - name: Regenerate apps/cli's uv.lock if the version bump left it stale
        working-directory: apps/cli
        # Same as the step above, for the second uv project (ADR 0137). It runs after that step
        # on the same checkout, so a commit made there is already in HEAD when this one pushes.
        env:
          PR_BRANCH: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
        run: |
          mise run lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(cli): sync uv.lock with release-please's version bump"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
      - name: Regenerate the Python packages' uv.lock if the version bump left it stale
        # The same for the three Python packages with a uv.lock of their own (apps/api, apps/cli and
        # converters depend on them by path). One commit per package, one push at the end; an
        # unchanged lockfile commits nothing.
        env:
          PR_BRANCH: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in packages/calendar-engine packages/converters packages/map-engine; do
            (cd "$dir" && mise exec -- uv lock)
            if git diff --quiet -- "$dir/uv.lock"; then
              echo "$dir/uv.lock already in sync"
              continue
            fi
            git add "$dir/uv.lock"
            git commit -m "chore($(basename "$dir")): sync uv.lock with release-please's version bump"
          done
          git push origin "HEAD:refs/heads/$PR_BRANCH"
