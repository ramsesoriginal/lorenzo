name: Docs

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # CHANGELOG.md is bot-written (release-please) and its template
          # produces double blank lines between sections - not something a
          # human can fix without it recurring on the next release.
          globs: |
            **/*.md
            !**/CHANGELOG.md

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # localhost URLs are illustrative ("once running, visit this") not
          # real links to validate - there's obviously nothing listening on
          # localhost in a CI runner. CHANGELOG.md's own compare-link points
          # at a tag (e.g. api-v0.2.0) that only starts existing once
          # release-please's PR merges - always a 404 while the PR is open.
          args: --no-progress --exclude 'localhost' --exclude-path 'CHANGELOG\.md$' '**/*.md'
