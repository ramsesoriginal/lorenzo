name: Deploy Inventory Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/inventory-web/**'
  workflow_dispatch:

concurrency:
  group: deploy-inventory-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Self-contained rather than depending on ci.yml via workflow_run - same
  # reasoning as deploy-api.yml. A static build has no DB/Cloud Run steps to
  # mirror from it, per docs/guides/adding-an-app.md's warning against
  # forcing a shared deploy shape across apps that deploy differently.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
      - run: mise run lint
        working-directory: apps/inventory-web
      - run: mise run test
        working-directory: apps/inventory-web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - run: mise run build
        working-directory: apps/inventory-web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/inventory-web/dist --project-name=lorenzo-inventory-web
