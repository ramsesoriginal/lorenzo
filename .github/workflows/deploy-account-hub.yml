name: Deploy Account Hub

on:
  push:
    branches: [main]
    paths:
      - 'apps/account-hub/**'
  workflow_dispatch:

concurrency:
  group: deploy-account-hub-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  # Self-contained rather than depending on ci.yml via workflow_run - same
  # reasoning as deploy-inventory-web.yml. A static build has no DB/Cloud Run
  # steps to mirror from it, per docs/guides/adding-an-app.md's warning
  # against forcing a shared deploy shape across apps that deploy differently.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
      - run: mise run lint
        working-directory: apps/account-hub
      - run: mise run test
        working-directory: apps/account-hub

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - run: mise run build
        working-directory: apps/account-hub

      - id: deploy
        name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret (an account identifier, not a credential) - same
          # treatment as GCP_PROJECT_ID etc. in deploy-api.yml.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/account-hub/dist --project-name=lorenzo-account-hub
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the deployment is actually reachable
        run: curl --fail --silent --show-error "${{ steps.deploy.outputs.deployment-url }}"
