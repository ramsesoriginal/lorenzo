name: Deploy beings

# Cloudflare Pages deploy of apps/beings (ADR 0270). It does nothing until the Pages project, the
# Authgear client and the repository's secrets exist: the jobs run only when the repository variable
# BEINGS_DEPLOY_ENABLED is "true". The steps to get there are in docs/operations/beings-setup.md.
# (The other two static apps use Cloudflare's own Git integration instead, ADR 0071's addendum; if you
# choose that for this app too, leave the variable unset and delete this file.)

on:
  push:
    branches: [main]
    paths:
      - 'apps/beings/**'
      # Bundled into the site.
      - 'packages/api-client/**'
      - 'packages/brand/**'
      - 'packages/lorenzoscript/**'
      - 'packages/lorenzoscript-editor/**'
      - 'packages/stat-values/**'
      - '.github/workflows/deploy-beings.yml'
  workflow_dispatch:

concurrency:
  group: deploy-beings-${{ github.ref }}
  cancel-in-progress: false # queue, never race two deploys

permissions:
  contents: read

# Pinned mise, same reason and bump rule as in ci.yml.
env:
  MISE_VERSION: "2026.9.15"

jobs:
  # Self-contained rather than depending on ci.yml via workflow_run, like deploy-loot-bot.yml.
  verify:
    if: ${{ vars.BEINGS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: npm install --global corepack@latest && corepack enable
      - run: mise run lint
        working-directory: apps/beings
      - run: mise run test
        working-directory: apps/beings

  deploy:
    needs: verify
    if: ${{ vars.BEINGS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: npm install --global corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: apps/beings
      # The PUBLIC_ values are public by nature (they end up in the bundle): variables, not secrets.
      - run: pnpm run build
        working-directory: apps/beings
        env:
          PUBLIC_AUTHGEAR_ENDPOINT: ${{ vars.BEINGS_AUTHGEAR_ENDPOINT }}
          PUBLIC_AUTHGEAR_CLIENT_ID: ${{ vars.BEINGS_AUTHGEAR_CLIENT_ID }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_INVENTORY_WEB_BASE_URL: ${{ vars.PUBLIC_INVENTORY_WEB_BASE_URL }}
          PUBLIC_ACCOUNT_HUB_BASE_URL: ${{ vars.PUBLIC_ACCOUNT_HUB_BASE_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/beings
          command: pages deploy dist --project-name=lorenzo-beings --branch=main
