name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  MISE_VERSION: "2026.9.15"

jobs:
  # CodeQL fails outright (not a harmless no-op) if a language has zero
  # matching source files - confirmed the hard way on this repo's first
  # real PR. So: discover which languages actually have source, same
  # pattern as ci.yml's discover job, rather than hardcoding a language
  # list that assumes something exists.
  discover:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.find.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the pull request's base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - id: find
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          langs="[]"
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            langs=$(echo "$langs" | jq -c '. + ["python"]')
          fi
          if find . \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*' -not -path '*/node_modules/*' | grep -q .; then
            langs=$(echo "$langs" | jq -c '. + ["javascript-typescript"]')
          fi
          if find apps/inventory-mobile -name '*.kt' -not -path '*/build/*' | grep -q .; then
            langs=$(echo "$langs" | jq -c '. + ["java-kotlin"]')
          fi
          # Swift pays for a native build: unrelated PRs do not need it (ADR 0148).
          if [ "$EVENT_NAME" = pull_request ]; then
            swift_scan=$(python3 .github/scripts/swift_codeql.py --base "$BASE_SHA")
          else
            swift_scan=$(python3 .github/scripts/swift_codeql.py)
          fi
          echo "Swift CodeQL selected: $swift_scan"
          if [ "$swift_scan" = true ]; then
            langs=$(echo "$langs" | jq -c '. + ["swift"]')
          fi
          echo "Discovered languages: $langs"
          echo "languages=$langs" >> "$GITHUB_OUTPUT"
          # Add csharp/ruby detection here once an app in that
          # language actually exists - compiled-language CodeQL needs
          # something real to build, not just a matching file extension.

  codeql:
    needs: discover
    if: needs.discover.outputs.languages != '[]'
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    env:
      DEVELOPER_DIR: ${{ matrix.language == 'swift' && '/Applications/Xcode_16.4.app/Contents/Developer' || '' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.discover.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      # Only the downloaded libraries help here: the build below runs every task again (see there).
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.language == 'java-kotlin'
      # Asset preparation is not production Swift and need not be traced.
      - name: Prepare Swift project
        if: matrix.language == 'swift'
        working-directory: apps/inventory-ios
        run: |
          swift scripts/icon.swift
          python3 scripts/project.py
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: ${{ (matrix.language == 'java-kotlin' || matrix.language == 'swift') && 'manual' || 'none' }}
      - name: Build Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: apps/inventory-mobile
        # CodeQL watches the compiler run, so every task runs again (--rerun-tasks), and only the
        # compilers' tasks are asked for: dexing and packaging an APK have no source for it to read.
        run: mise exec -- ./gradlew --no-daemon --no-build-cache --rerun-tasks :app:compileDebugKotlin :app:compileDebugJavaWithJavac :core:classes
      - name: Build Swift for CodeQL
        if: matrix.language == 'swift'
        working-directory: apps/inventory-ios
        # Fresh compiler work is required for extraction; never restore compiled objects.
        # Keep Release conditions, but skip optimization and IPA packaging.
        run: |
          derived=$(mktemp -d "${TMPDIR:-/tmp}/lorenzo-codeql.XXXXXX")
          xcodebuild -project LorenzoInventory.xcodeproj -target LorenzoInventory \
            -configuration Release -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$derived/products" OBJROOT="$derived/objects" \
            SYMROOT="$derived/symbols" ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
            -showBuildTimingSummary build
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
