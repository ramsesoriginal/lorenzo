name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Finds every apps/*/mise.toml - that file is the "this is a real,
  # scaffolded app" marker (see docs/adr/0007-apps-layout-and-multiplicity.md).
  # Currently discovers apps/api; a future app with no mise.toml yet simply
  # isn't matched, so the test job's matrix below runs zero times for it,
  # rather than failing.
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          apps=$(find apps -mindepth 2 -maxdepth 2 -name mise.toml | xargs -n1 dirname | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "Discovered apps: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    # Scoped to the whole job, so every matrix entry gets it even once a
    # future non-Postgres app joins - accepted for now, revisit if that
    # actually happens (see docs/adr/0007 discovery pattern).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lorenzo
          POSTGRES_PASSWORD: lorenzo
          POSTGRES_DB: lorenzo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # v2026.9.2 doesn't exist as a real mise release (confirmed via the
          # GitHub API) but the action's default "latest" detection grabbed
          # it anyway and 404'd - this is exactly what minimum_release_age
          # exists to prevent, per the action's own README.
          minimum_release_age: 7d
      - run: mise run lint
        working-directory: ${{ matrix.app }}
      - run: mise run test
        working-directory: ${{ matrix.app }}
        env:
          # DATABASE_URL: what the app/tests connect as - a restricted role
          # RLS actually applies to (ADR 0021). MIGRATIONS_DATABASE_URL:
          # what Alembic connects as - stays privileged, since it's what
          # creates lorenzo_app in the first place.
          DATABASE_URL: postgresql+asyncpg://lorenzo_app:lorenzo_app@localhost:5432/lorenzo
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://lorenzo:lorenzo@localhost:5432/lorenzo

  # Not matrixed over discover's output like `test` is: an OpenAPI schema
  # dump isn't part of ADR 0007's universal per-app contract (only
  # dev/lint/test/build are), so a future non-FastAPI app would hard-fail on
  # a task it doesn't have. Scoped to apps/api directly instead. Diffs two
  # same-job checkouts rather than a published artifact from main - simpler,
  # no retention/staleness concerns, and it diffs against the PR's actual
  # base commit rather than main's last green build.
  openapi-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: revision
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
      - run: mise run openapi-schema
        working-directory: revision/apps/api
      - run: mise run openapi-schema
        working-directory: base/apps/api
        # Base commit may predate this task existing at all (e.g. this very
        # PR, or an old branch) - the next step's hashFiles check skips
        # gracefully rather than failing when that happens.
        continue-on-error: true
      - name: Check for breaking changes
        if: hashFiles('base/apps/api/openapi.json') != ''
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: base/apps/api/openapi.json
          revision: revision/apps/api/openapi.json
          fail-on: ERR

  # discover/test report no useful status if the matrix ever ends up empty
  # (test is skipped then, not failed) - this job always runs regardless, so
  # it can be the one required status check that's always meaningful. See
  # docs/operations/github-setup.md.
  ci-summary:
    needs: [discover, test, openapi-diff]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.openapi-diff.result }}" = "failure" ]; then
            echo "A required job failed."
            exit 1
          fi
          echo "OK"
