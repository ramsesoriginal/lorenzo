name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# mise itself is pinned, not "latest". Left floating, the action picks the newest release older than
# minimum_release_age, finds the restored cache holds an older mise, and runs `mise self-update`, which
# asks api.github.com without a token and gets HTTP 403 (rate limited) before a single test runs. The
# cache is only saved on a miss, so it never refreshes itself, and every new mise release broke every
# job again. With a version given, the action downloads that release from its release URL (no API
# call, no self-update, minimum_release_age is ignored) and puts the version in the cache key, so a
# bump gets a fresh cache. To bump: change MISE_VERSION, in every workflow that has it (grep for it),
# to a release at least a week old.
env:
  MISE_VERSION: "2026.9.15"

jobs:
  # Decides what this change can affect (ADR 0148). Every apps/*/mise.toml and packages/*/mise.toml is a
  # node (docs/adr/0007-apps-layout-and-multiplicity.md; packages since ADR 0100); a change reaches its
  # own node and everything that depends on it, never what it depends on. Dependencies are derived from
  # package.json and uv path sources, plus the hand-written .github/ci-graph.toml. A push to main is
  # the full run: everything is affected. A node CI can't read and that isn't declared fails this job.
  # Nothing here needs mise or a toolchain: the script is standard-library Python, so it is fast.
  discover:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.find.outputs.test_matrix }}
      drift_matrix: ${{ steps.find.outputs.drift_matrix }}
      suites: ${{ steps.find.outputs.suites }}
      openapi_diff: ${{ steps.find.outputs.openapi_diff }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the pull request's base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
      - id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .github/scripts/affected.py --root . --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 .github/scripts/affected.py --root . --all --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi

  # The script's own tests. Always runs, and is cheap: it decides what every other job runs.
  ci-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s .github/scripts -v

  test:
    name: test (${{ matrix.label }})
    needs: discover
    if: needs.discover.outputs.test_matrix != '[]'
    runs-on: ${{ matrix.app == 'apps/inventory-ios' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.test_matrix) }}
    steps:
      # Only nodes marked `postgres = true` in .github/ci-graph.toml touch Postgres (apps/api's tests,
      # apps/cli's end-to-end stack, apps/loot-bot's own schema); a service container on every leg
      # cost the others 15-25 s each (ADR 0148). It starts in the background, first of all, so its
      # image pull and boot overlap the checkout and the toolchain (ADR 0148, addendum of 2026-10-08);
      # the step before the tests waits for it.
      - name: Start Postgres
        if: matrix.postgres
        run: |
          nohup docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=lorenzo -e POSTGRES_PASSWORD=lorenzo -e POSTGRES_DB=lorenzo \
            postgres:17-alpine > "$RUNNER_TEMP/postgres-start.log" 2>&1 < /dev/null &
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      # pnpm itself ships via corepack, not as a mise [tools] entry (ADR
      # 0003) - needed job-wide once any app is a pnpm workspace member
      # (apps/loot-bot, ADR 0029); a no-op for apps/api's own matrix entry.
      - run: npm install --global corepack@latest && corepack enable
      - name: Set up Android SDK
        if: contains(format(' {0} ', matrix.apps), ' apps/inventory-mobile ')
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      # Gradle's dependencies and the transforms of them (dexing the libraries) are restored from main's
      # last run, not fetched and built again by every one (ADR 0148, addendum of 2026-10-15).
      - uses: gradle/actions/setup-gradle@v6
        if: contains(format(' {0} ', matrix.apps), ' apps/inventory-mobile ')
      # A node split over several runners (`shards` in .github/ci-graph.toml) lints once, on the first.
      # A leg of several nodes (`batch` in the same file) runs them one after the other and runs every
      # one, so a failure in the first doesn't hide the rest.
      - name: Lint
        if: matrix.shard == '' || startsWith(matrix.shard, '1/')
        env:
          APPS: ${{ matrix.apps }}
        run: |
          status=0
          for app in $APPS; do
            echo "::group::lint $app"
            (cd "$app" && mise run lint) || { echo "::error::lint failed in $app"; status=1; }
            echo "::endgroup::"
          done
          exit $status
      # Asks over TCP: while the image first starts, a server that only listens on its socket answers
      # too, and is then restarted.
      - name: Wait for Postgres
        if: matrix.postgres
        run: |
          timeout 90 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U lorenzo > /dev/null 2>&1; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/postgres-start.log"; docker logs postgres; exit 1; }
      - name: Test
        run: |
          status=0
          for app in $APPS; do
            echo "::group::test $app"
            (cd "$app" && mise run test) || { echo "::error::tests failed in $app"; status=1; }
            echo "::endgroup::"
          done
          exit $status
        env:
          APPS: ${{ matrix.apps }}
          # "2/3": run the second of three groups of test files (apps/api's conftest.py). Empty: all.
          TEST_SHARD: ${{ matrix.shard }}
          # DATABASE_URL: what the app/tests connect as - a restricted role
          # RLS actually applies to (ADR 0021). MIGRATIONS_DATABASE_URL:
          # what Alembic connects as - stays privileged, since it's what
          # creates lorenzo_app in the first place.
          DATABASE_URL: postgresql+asyncpg://lorenzo_app:lorenzo_app@localhost:5432/lorenzo
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://lorenzo:lorenzo@localhost:5432/lorenzo
          # apps/loot-bot's own restricted role/schema (ADR 0029) - same
          # Postgres service container/database as above, a separate role
          # loot-bot's own migrations bootstrap on first run (src/migrate.ts).
          LOOT_BOT_DATABASE_URL: postgres://loot_bot:loot_bot@localhost:5432/lorenzo
          LOOT_BOT_MIGRATIONS_DATABASE_URL: postgres://lorenzo:lorenzo@localhost:5432/lorenzo
          # The rest of apps/loot-bot's required config (config.ts) - none of
          # these need to be real: its tests never call a real Discord or
          # Authgear, only a fake local Authgear-shaped server
          # (tests/fake-authgear-server.ts, mirroring apps/api's own
          # tests/_fake_jwks.py) and mocked HTTP - but loadConfig() still
          # validates the shape of every var eagerly (some at module-import
          # time, via db.ts), so a placeholder value is still required for
          # each. LOOT_BOT_TOKEN_ENCRYPTION_KEY must still decode (as
          # base64) to exactly 32 bytes even as a placeholder (src/crypto.ts).
          DISCORD_BOT_TOKEN: ci-placeholder-token
          DISCORD_CLIENT_ID: "000000000000000000"
          DISCORD_GUILD_ID: "000000000000000001"
          DISCORD_PUBLIC_KEY: ci-placeholder-public-key
          LORENZO_API_BASE_URL: http://localhost:8000
          LORENZO_TENANT_ID: 00000000-0000-0000-0000-000000000000
          AUTHGEAR_ISSUER: http://localhost:4000
          AUTHGEAR_CLIENT_ID: ci-placeholder-client
          AUTHGEAR_CLIENT_SECRET: ci-placeholder-secret
          LOOT_BOT_TOKEN_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

      - uses: actions/upload-artifact@v7
        if: always() && matrix.app == 'apps/inventory-ios'
        with:
          name: iOS-simulator-results
          path: |
            apps/inventory-ios/build/screenshots/*.png
            apps/inventory-ios/build/screenshots/*.jpg
            apps/inventory-ios/build/screenshots/*.jpeg
            apps/inventory-ios/build/screenshots/*.txt
            apps/inventory-ios/build/screenshots/manifest.json
            apps/inventory-ios/build-uitest.log
          retention-days: 1

  # apps/inventory-mobile's installable debug APK and unsigned release bundle. The `mobile-build` suite in
  # .github/ci-graph.toml: it runs when the app or what it depends on changes, beside the node's lint and
  # tests (the `test` job above) and not after them: each takes about 150 s (ADR 0148, addendum of

  # 2026-10-15).
  mobile-build:
    name: mobile-build
    needs: discover
    if: contains(fromJson(needs.discover.outputs.suites), 'mobile-build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: mise run build
        working-directory: apps/inventory-mobile

  # Not matrixed over discover's output like `test` is: an OpenAPI schema
  # dump isn't part of ADR 0007's universal per-app contract (only
  # dev/lint/test/build are), so a future non-FastAPI app would hard-fail on
  # a task it doesn't have. Scoped to apps/api directly instead. Diffs two
  # same-job checkouts rather than a published artifact from main - simpler,
  # no retention/staleness concerns, and it diffs against the PR's actual
  # base commit rather than main's last green build.
  openapi-diff:
    needs: discover
    if: github.event_name == 'pull_request' && needs.discover.outputs.openapi_diff == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: revision
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run openapi-schema
        working-directory: revision/apps/api
      - run: mise run openapi-schema
        working-directory: base/apps/api
        # Base commit may predate this task existing at all (e.g. this very
        # PR, or an old branch) - the next step's hashFiles check skips
        # gracefully rather than failing when that happens.
        continue-on-error: true
      - name: Check for breaking changes
        if: hashFiles('base/apps/api/openapi.json') != ''
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: base/apps/api/openapi.json
          revision: revision/apps/api/openapi.json
          fail-on: ERR
          # Deliberately accepted breaks, each backed by an ADR - see the
          # file's own header. Everything else still fails the job.
          err-ignore: revision/apps/api/openapi-breaking-accepted.txt

  # A generated client's committed schema can silently fall behind apps/api's routes/schemas (the same
  # class of gap release.yml's sync-lockfile job catches for uv.lock), so every node with a
  # `check-schema` task is checked whenever it, or the node it is generated from, is affected (ADR
  # 0148; `generated_from` in .github/ci-graph.toml). Today that is packages/api-client (ADR 0122)
  # and apps/cli's generated models and operations table (ADR 0137). A push to main checks them all,
  # so a drift that slips in some other way still shows up red.
  client-drift:
    name: client-drift (${{ matrix.app }})
    needs: discover
    if: needs.discover.outputs.drift_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.drift_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: npm install --global corepack@latest && corepack enable
      - run: mise run check-schema
        working-directory: ${{ matrix.app }}

  # inventory-web's end-to-end tests (ADR 0114): the built site in a browser, against the real
  # apps/api and a fake Authgear. Its own job rather than a `test` matrix entry, since it needs
  # uv for the API and a browser besides Postgres. It is the `inventory-web-e2e` suite in
  # .github/ci-graph.toml: it runs when inventory-web, anything it depends on, or the API is affected.
  e2e:
    name: e2e (inventory-web ${{ matrix.shard }})
    needs: discover
    if: contains(fromJson(needs.discover.outputs.suites), 'inventory-web-e2e')
    runs-on: ubuntu-latest
    # The spec files are split over four runners, each with its own Postgres and API, by their recorded
    # duration (apps/inventory-web/scripts/e2e-shard.mjs, ADR 0148's addendum of 2026-10-14): Playwright's
    # own --shard splits by the number of tests, and one of three shards took twice what another did.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      # In the background and first of all, instead of a `services:` container that held the whole job
      # back for 10-20 s before its first step: the pull and boot overlap everything up to the wait.
      - name: Start Postgres
        run: |
          nohup docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=lorenzo -e POSTGRES_PASSWORD=lorenzo -e POSTGRES_DB=lorenzo \
            postgres:17-alpine > "$RUNNER_TEMP/postgres-start.log" 2>&1 < /dev/null &
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: npm install --global corepack@latest && corepack enable
      # The API's Python environment, built in the background while pnpm installs: Playwright starts
      # the API with `uv run`, which would otherwise build it first, the dev tools included (about
      # 5 s of a shard, ADR 0148, addendum of 2026-10-08).
      - name: Build the API's environment
        run: |
          nohup sh -c 'uv sync --frozen --no-dev --project apps/api; echo $? > "$RUNNER_TEMP/api-env.status"' \
            > "$RUNNER_TEMP/api-env.log" 2>&1 < /dev/null &
      - run: pnpm install --frozen-lockfile
        working-directory: apps/inventory-web
      - name: Wait for Postgres and the API's environment
        run: |
          timeout 90 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U lorenzo > /dev/null 2>&1; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/postgres-start.log"; docker logs postgres; exit 1; }
          timeout 120 sh -c 'until [ -f "$RUNNER_TEMP/api-env.status" ]; do sleep 1; done'
          [ "$(cat "$RUNNER_TEMP/api-env.status")" = 0 ] || { cat "$RUNNER_TEMP/api-env.log"; exit 1; }
      # Playwright's headless shell, cached by Playwright's version, and installed without
      # `--with-deps`, whose apt packages the runner image already has (a shard's install was 21-33 s).
      # Not the runner's own Chrome: its new headless mode ran the test steps 28-43 s longer and
      # laid out the phone width differently (ADR 0148, addendum of 2026-10-08).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/inventory-web
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium-headless-shell
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/inventory-web
      - run: pnpm exec playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }})
        working-directory: apps/inventory-web
        env:
          # `uv run` then finds the environment built above and leaves the dev tools out.
          UV_NO_DEV: 1
          E2E_POSTGRES_URL: postgres://lorenzo:lorenzo@127.0.0.1:5432/postgres
          E2E_APP_POSTGRES_URL: postgres://lorenzo_app:lorenzo_app@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            apps/inventory-web/playwright-report/
            apps/inventory-web/test-results/
          retention-days: 7

  # apps/beings' end-to-end tests (ADR 0270): the built site in a browser, against the real apps/api
  # and a fake Authgear, its own launchers on its own ports. The `beings-e2e` suite in
  # .github/ci-graph.toml: it runs when beings, anything it depends on, or the API is affected.
  e2e-beings:
    name: e2e (beings ${{ matrix.shard }})
    needs: discover
    if: contains(fromJson(needs.discover.outputs.suites), 'beings-e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      # Postgres in the background and a cached headless shell: see the inventory-web job.
      - name: Start Postgres
        run: |
          nohup docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=lorenzo -e POSTGRES_PASSWORD=lorenzo -e POSTGRES_DB=lorenzo \
            postgres:17-alpine > "$RUNNER_TEMP/postgres-start.log" 2>&1 < /dev/null &
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: npm install --global corepack@latest && corepack enable
      - name: Build the API's environment
        run: |
          nohup sh -c 'uv sync --frozen --no-dev --project apps/api; echo $? > "$RUNNER_TEMP/api-env.status"' \
            > "$RUNNER_TEMP/api-env.log" 2>&1 < /dev/null &
      - run: pnpm install --frozen-lockfile
        working-directory: apps/beings
      - name: Wait for Postgres and the API's environment
        run: |
          timeout 90 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U lorenzo > /dev/null 2>&1; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/postgres-start.log"; docker logs postgres; exit 1; }
          timeout 120 sh -c 'until [ -f "$RUNNER_TEMP/api-env.status" ]; do sleep 1; done'
          [ "$(cat "$RUNNER_TEMP/api-env.status")" = 0 ] || { cat "$RUNNER_TEMP/api-env.log"; exit 1; }
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/beings
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium-headless-shell
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/beings
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}
        working-directory: apps/beings
        env:
          UV_NO_DEV: 1
          E2E_POSTGRES_URL: postgres://lorenzo:lorenzo@127.0.0.1:5432/postgres
          E2E_APP_POSTGRES_URL: postgres://lorenzo_app:lorenzo_app@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-beings-${{ strategy.job-index }}
          path: |
            apps/beings/playwright-report/
            apps/beings/test-results/
          retention-days: 7

  # apps/bench's browser tests: the sample workbench and real information editing.
  # The real-API suite reuses beings' API/Authgear launchers. The `bench-e2e` suite in .github/ci-graph.toml: it runs when bench or anything it
  # depends on is affected.
  e2e-bench:
    name: e2e (bench)
    needs: discover
    if: contains(fromJson(needs.discover.outputs.suites), 'bench-e2e')
    runs-on: ubuntu-latest
    steps:
      - name: Start Postgres
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=lorenzo -e POSTGRES_PASSWORD=lorenzo -e POSTGRES_DB=lorenzo \
            postgres:17-alpine
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: npm install --global corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: apps/bench
      # The same cached headless shell as the inventory-web job, installed without `--with-deps`.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/bench
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium-headless-shell
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/bench
      - run: pnpm exec playwright test
        working-directory: apps/bench
      - name: Real information editing
        run: |
          timeout 90 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U lorenzo > /dev/null 2>&1; do sleep 1; done'
          pnpm run test:e2e-api
        working-directory: apps/bench
        env:
          UV_NO_DEV: 1
          E2E_POSTGRES_URL: postgres://lorenzo:lorenzo@127.0.0.1:5432/postgres
          E2E_APP_POSTGRES_URL: postgres://lorenzo_app:lorenzo_app@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-bench
          path: |
            apps/bench/playwright-report/
            apps/bench/test-results/
          retention-days: 7

  # apps/account-hub's browser tests against the real API (ADR 0136, ADR 0196): the same stack as the
  # job above, started by inventory-web's launchers. The `account-hub-real-api` suite in
  # .github/ci-graph.toml: it runs when the hub, the API or inventory-web is affected. It runs the
  # logged-out smoke tests and the specs that are current with the pages; the ones that went stale
  # when the pages were reworked are left out until they are repaired (see tests/real-api/README.md).
  account-hub-real-api:
    name: account-hub real-api ${{ matrix.shard }}
    needs: discover
    if: contains(fromJson(needs.discover.outputs.suites), 'account-hub-real-api')
    runs-on: ubuntu-latest
    # Two runners, each with its own Postgres and API; Playwright's own --shard splits the tests.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      # Postgres in the background and a cached headless shell: see the job above.
      - name: Start Postgres
        run: |
          nohup docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=lorenzo -e POSTGRES_PASSWORD=lorenzo -e POSTGRES_DB=lorenzo \
            postgres:17-alpine > "$RUNNER_TEMP/postgres-start.log" 2>&1 < /dev/null &
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: npm install --global corepack@latest && corepack enable
      # The API's environment in the background while pnpm installs: see the job above.
      - name: Build the API's environment
        run: |
          nohup sh -c 'uv sync --frozen --no-dev --project apps/api; echo $? > "$RUNNER_TEMP/api-env.status"' \
            > "$RUNNER_TEMP/api-env.log" 2>&1 < /dev/null &
      - run: pnpm install --frozen-lockfile
        working-directory: apps/account-hub
      - name: Wait for Postgres and the API's environment
        run: |
          timeout 90 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U lorenzo > /dev/null 2>&1; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/postgres-start.log"; docker logs postgres; exit 1; }
          timeout 120 sh -c 'until [ -f "$RUNNER_TEMP/api-env.status" ]; do sleep 1; done'
          [ "$(cat "$RUNNER_TEMP/api-env.status")" = 0 ] || { cat "$RUNNER_TEMP/api-env.log"; exit 1; }
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/account-hub
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium-headless-shell
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/account-hub
      - run: pnpm run test:real-api:ci --shard=${{ matrix.shard }}
        working-directory: apps/account-hub
        env:
          UV_NO_DEV: 1
          E2E_POSTGRES_URL: postgres://lorenzo:lorenzo@127.0.0.1:5432/postgres
          E2E_APP_POSTGRES_URL: postgres://lorenzo_app:lorenzo_app@127.0.0.1:5432/postgres
      # The launcher above holds no releases apart (ADR 0301), since its specs release one repository
      # again and again; this one spec runs once, on a launcher at the API's own default of 300 s.
      - run: pnpm exec playwright test --config playwright.real-api.config.ts tests/real-api/studio-release-cooldown.spec.ts
        if: matrix.shard == '1/2'
        working-directory: apps/account-hub
        env:
          UV_NO_DEV: 1
          E2E_RELEASE_COOLDOWN_SECONDS: 300
          E2E_POSTGRES_URL: postgres://lorenzo:lorenzo@127.0.0.1:5432/postgres
          E2E_APP_POSTGRES_URL: postgres://lorenzo_app:lorenzo_app@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-account-hub-${{ strategy.job-index }}
          path: |
            apps/account-hub/playwright-report/
            apps/account-hub/test-results/
          retention-days: 7

  # apps/cli's end-to-end tests (ADR 0137, ADR 0148): the real API on a fresh database behind a fake
  # Authgear, the CLI run against it. The `cli-e2e` suite in .github/ci-graph.toml: it runs when the CLI
  # or the API is affected. Split over three runners, each with its own Postgres; conftest.py's
  # TEST_SHARD picks the test files. If the stack can't start here it must fail, not skip (ADR 0143).
  cli-e2e:
    name: cli-e2e (${{ matrix.shard }})
    needs: discover
    if: contains(fromJson(needs.discover.outputs.suites), 'cli-e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Start Postgres
        run: |
          nohup docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=lorenzo -e POSTGRES_PASSWORD=lorenzo -e POSTGRES_DB=lorenzo \
            postgres:17-alpine > "$RUNNER_TEMP/postgres-start.log" 2>&1 < /dev/null &
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Wait for Postgres
        run: |
          timeout 90 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U lorenzo > /dev/null 2>&1; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/postgres-start.log"; docker logs postgres; exit 1; }
      - run: mise run test-e2e
        working-directory: apps/cli
        env:
          LORENZO_REQUIRE_E2E: "1"
          TEST_SHARD: ${{ matrix.shard }}
          # Where the stack finds Postgres (tests/e2e/stack.py); it makes its own database there.
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://lorenzo:lorenzo@localhost:5432/lorenzo

  # The one required status check (besides CodeQL) - .github/rulesets/main.json, ADR 0148. It always
  # runs, so it is meaningful even when a matrix is empty or a job is skipped, and it covers every job
  # in `needs` without naming them: skipped is fine, failed or cancelled is not. A job that gates a
  # merge must be listed in `needs`, or nothing will ever wait for it.

  ios-build:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.suites), 'ios-build')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run build
        working-directory: apps/inventory-ios
      - name: Prepare Swift formatting patch
        if: always()
        working-directory: apps/inventory-ios
        run: |
          mkdir -p build
          swift format format --in-place --recursive Sources Tests StateTests UITests
          git diff -- Sources Tests StateTests UITests > build/swift-format.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Lorenzo-Inventory-iOS
          path: |
            apps/inventory-ios/build/Lorenzo-Inventory.ipa
            apps/inventory-ios/build/swift-format.patch
          retention-days: 1

  ci-summary:
    needs: [discover, ci-tools, test, openapi-diff, client-drift, e2e, e2e-beings, e2e-bench, account-hub-real-api, cli-e2e, mobile-build, ios-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "OK"
