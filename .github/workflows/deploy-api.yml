name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/calendar-engine/**'
      - 'packages/map-engine/**'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false # queue, never race two deploys/migrations

permissions:
  contents: read
  id-token: write

# Pinned mise, same reason and bump rule as in ci.yml.
env:
  MISE_VERSION: "2026.9.15"

jobs:
  # Self-contained rather than depending on ci.yml via workflow_run - simpler,
  # and re-running tests costs nothing on a public repo's free Actions
  # minutes. A broken push can never reach deploy even if this workflow
  # somehow ran on its own.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lorenzo
          POSTGRES_PASSWORD: lorenzo
          POSTGRES_DB: lorenzo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run lint
        working-directory: apps/api
      - run: mise run test
        working-directory: apps/api
        env:
          # Same split as ci.yml - see ADR 0021.
          DATABASE_URL: postgresql+asyncpg://lorenzo_app:lorenzo_app@localhost:5432/lorenzo
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://lorenzo:lorenzo@localhost:5432/lorenzo

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - id: meta
        run: echo "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lorenzo-api/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - uses: astral-sh/setup-uv@v7

      - name: Run migrations against Neon
        working-directory: apps/api
        env:
          # Privileged - creates/grants lorenzo_app, among other things
          # (ADR 0021). Not what the deployed service itself connects as;
          # see the deploy step below.
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          uv sync --locked
          uv run alembic upgrade head

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: lorenzo-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.meta.outputs.image }}
          # DATABASE_URL: restricted role (ADR 0021), rotated and verified
          # against production - see docs/operations/deployment-setup.md.
          # AUTHGEAR_*: Authgear Cloud, not self-hosted (ADR 0027) - public
          # OIDC metadata URLs, not credentials, so these come from
          # `vars` like GCP_REGION/GCP_PROJECT_ID above, not `secrets`.
          # CORS_ALLOWED_ORIGINS (ADR 0048): space-separated exact origins,
          # e.g. "https://a.example.com https://b.example.com" - deliberately
          # not a JSON array. deploy-cloudrun's own `env_vars` joins
          # KEY=VALUE pairs with `,`, and a JSON array of more than one
          # origin has a literal `,` *inside* the value - that collided with
          # the separator and crashed a real deploy (`SettingsError: error
          # parsing value for field "cors_allowed_origins"`, the container
          # only ever seeing a truncated, invalid-JSON fragment) even after
          # trying to backslash-escape it, since gcloud's own list-argument
          # parser doesn't actually support that (only its own `^DELIM^`
          # alternate-delimiter syntax does, which this action doesn't
          # expose control over). Switching the format to space-separated
          # means no comma - and thus no collision - regardless of how many
          # origins are listed. Settings.cors_allowed_origins parses this
          # (config.py's `_parse_cors_origins`, NoDecode-annotated so
          # pydantic-settings' own auto-JSON-decoding never runs first) -
          # an unset GitHub variable arrives as "" and parses to `[]`, same
          # fail-closed default as before.
          # INVITE_RATE_LIMIT_TRUSTED_PROXY_HOPS (ADR 0092): Cloud Run's own
          # front end is exactly one trusted proxy in front of this service.
          # Left at its default of 0, every caller would look like that front
          # end's address and share ONE rate-limit bucket - the invite-link
          # backstop would throttle everyone together. With 1, the limiter
          # keys on the rightmost X-Forwarded-For entry (the address that
          # front end actually saw), which a client cannot spoof. If a CDN
          # (e.g. Cloudflare) is ever put in front of the service, this
          # becomes 2 - see docs/operations/invite-link-rate-limiting.md.
          # REPORT_ADDRESS (ADR 0299): the mailbox behind a storefront's Report link; unset (empty)
          # means no link. PUBLIC_REPOSITORIES_ENABLED (ADR 0290): whether a repository can be made
          # public; an unset GitHub variable means off. Both are set under Settings, Secrets and
          # variables, Actions, Variables; see docs/operations/public-launch.md.
          # ACCOUNT_HUB_URL, INVENTORY_WEB_URL, BEINGS_URL, BENCH_URL, CALENDARS_URL, SESSIONS_URL, MAPS_URL,
          # APP_LINK_TEMPLATES
          # (ADR 0273): the registry GET /app-links serves. All optional: unset (empty)
          # means the official *.pages.dev address. APP_LINK_TEMPLATES is space-separated
          # name=template pairs, no commas, for the same reason as CORS_ALLOWED_ORIGINS.
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AUTHGEAR_ISSUER=${{ vars.AUTHGEAR_ISSUER }}
            AUTHGEAR_JWKS_URL=${{ vars.AUTHGEAR_JWKS_URL }}
            AUTHGEAR_AUDIENCE=${{ vars.AUTHGEAR_AUDIENCE }}
            AUTHGEAR_USERINFO_URL=${{ vars.AUTHGEAR_USERINFO_URL }}
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            ACCOUNT_HUB_URL=${{ vars.ACCOUNT_HUB_URL }}
            INVENTORY_WEB_URL=${{ vars.INVENTORY_WEB_URL }}
            BEINGS_URL=${{ vars.BEINGS_URL }}
            CALENDARS_URL=${{ vars.CALENDARS_URL }}
            SESSIONS_URL=${{ vars.SESSIONS_URL }}
            MAPS_URL=${{ vars.MAPS_URL }}
            BENCH_URL=${{ vars.BENCH_URL }}
            APP_LINK_TEMPLATES=${{ vars.APP_LINK_TEMPLATES }}
            REPORT_ADDRESS=${{ vars.REPORT_ADDRESS }}
            PUBLIC_REPOSITORIES_ENABLED=${{ vars.PUBLIC_REPOSITORIES_ENABLED || 'false' }}
            INVITE_RATE_LIMIT_TRUSTED_PROXY_HOPS=1

      - name: Verify the deployed revision is actually ready
        run: curl --fail --silent --show-error "${{ steps.deploy.outputs.url }}/readyz"
