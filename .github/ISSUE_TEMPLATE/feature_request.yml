name: Feature request
description: Propose something new or different
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend API
        - Web frontend
        - Discord bot
        - Mobile app
        - Tooling / CI
        - Documentation
        - Cross-cutting / not sure
    validations:
      required: true
