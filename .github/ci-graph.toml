# The hand-written part of CI's dependency graph (ADR 0148). .github/scripts/affected.py reads it.
#
# Every directory under apps/ or packages/ with a mise.toml is a node. These are derived, so they are
# NOT listed here: a package.json `workspace:` dependency, and a pyproject.toml uv path source.
# Write down only what no package manager sees. A node with neither a package.json nor a
# pyproject.toml (Kotlin, C#, apps/brand's plain CSS) MUST have a [nodes."..."] entry, even an empty
# one, or the `discover` job fails. Adding an app or a package: docs/guides/adding-an-app.md.
#
# Per node:
#   depends_on     nodes it uses. A change to one runs this node's tests too (never the other way).
#   generated_from nodes its committed, generated code comes from (a client generated from the
#                  OpenAPI schema). A change to the source runs this node's `check-schema` task
#                  (the drift check), but not its tests: they run only if the regenerated code,
#                  or anything else in the node, changed.
#   postgres       its `test` leg needs a Postgres container.
#   shards         split its `test` leg over this many runners (TEST_SHARD=i/n; the node's tests
#                  have to honour it, as apps/api's conftest.py does). Default 1.
#   batch          run its `lint` and `test` on one runner with the other nodes of the same batch
#                  name, one after the other, instead of a runner of its own. For a leg that takes
#                  under a minute: each runner costs 10-15 s to set up, and a push to main ran 33 jobs with
#                  16 at a time at most, so the slow legs waited behind small ones for a runner (ADR
#                  0148, addendum of 2026-10-14). Not for a node that needs Postgres or is sharded.

[global]
# A change to any of these runs every node.
run_everything = [
  "mise.toml",
  "package.json",
  "pnpm-workspace.yaml",
  ".tool-versions",
  ".github/workflows/ci.yml",
  ".github/ci-graph.toml",
  ".github/scripts/*",
]
# A change to this file runs every node that has a package.json.
pnpm_lockfile = "pnpm-lock.yaml"
# The node whose OpenAPI schema `openapi-diff` compares against the PR's base.
openapi_source = "apps/api"

[nodes."apps/api"]
postgres = true
# Two legs, each running its half on four parallel workers, each with a database cloned from a migrated
# template (apps/api/tests/_workers.py, ADR 0148): one leg of 1,635 tests took 116 s, the longest job.
shards = 2

[nodes."apps/cli"]
batch = "cli"
# Its table of other spellings is a copy of packages/inventory-names' (ADR 0242), and a test compares them; another parses the golden ledgers of packages/converters (ADR 0246).
depends_on = ["packages/inventory-names", "packages/converters", "packages/lorenzoscript"]
# Its unit tests need neither the API nor a database; the end-to-end tests, which start the real API,
# are the cli-e2e suite below. Its generated models come from the API's OpenAPI schema.
generated_from = ["apps/api"]

[nodes."apps/inventory-web"]
batch = "web-1"

[nodes."apps/account-hub"]
batch = "web-1"

[nodes."apps/beings"]
batch = "web-2"

[nodes."apps/bench"]
batch = "web-2"

[nodes."packages/inventory-names"]
batch = "cli"

[nodes."packages/converters"]
batch = "cli"

[nodes."packages/lorenzoscript"]
batch = "packages"

[nodes."packages/lorenzoscript-editor"]
batch = "packages"

[nodes."packages/stat-values"]
batch = "packages"

[nodes."apps/loot-bot"]
postgres = true

[nodes."apps/brand"]
batch = "packages"
# Plain CSS, fonts and icons: nothing to read.

[nodes."packages/brand"]
batch = "packages"
# Its build copies the whole apps/brand layout package in (ADR 0098).
depends_on = ["apps/brand"]

[nodes."packages/api-client"]
batch = "packages"
generated_from = ["apps/api"]

# Slow integration suites, each its own job. A suite runs when its node is affected, or anything
# it runs against is.
[suites.inventory-web-e2e]
node = "apps/inventory-web"
# Playwright against the real API and a fake Authgear (ADR 0114).
depends_on = ["apps/api"]

[suites.beings-e2e]
node = "apps/beings"
# Playwright against the real API and a fake Authgear, with a launcher of its own on ports of its
# own, so it can run beside inventory-web's (ADR 0270).
depends_on = ["apps/api"]

[suites.bench-e2e]
node = "apps/bench"
# Sample workbench and real information editing. API/Authgear fixtures are beings-owned.
depends_on = ["apps/api", "apps/beings"]

[suites.account-hub-real-api]
node = "apps/account-hub"
# The hub's own browser tests on the same stack (ADR 0114, ADR 0136, ADR 0196): the real API and a
# fake Authgear, reached through inventory-web's launchers.
depends_on = ["apps/api", "apps/inventory-web"]

[suites.cli-e2e]
node = "apps/cli"
# The real API on a fresh database behind a fake Authgear (ADR 0137), split over three runners.
depends_on = ["apps/api"]

[nodes."apps/inventory-mobile"]
# Native Kotlin adapter consumes the REST contract; copied fonts and icons follow the brand.
depends_on = ["apps/brand"]
generated_from = ["apps/api"]

# Its debug APK and unsigned release bundle (`mise run build`), a job beside the node's lint and tests
# instead of a step after them: each is about 150 s of Gradle.
[suites.mobile-build]
node = "apps/inventory-mobile"

[nodes."packages/information-editor"]
batch = "packages"

[nodes."packages/app-shell"]
batch = "packages"

[nodes."packages/period-picker"]
batch = "packages"

[nodes."packages/read-cache"]
batch = "packages"

[nodes."apps/inventory-ios"]
depends_on = ["apps/brand"]
generated_from = ["apps/api"]

[suites.ios-build]
node = "apps/inventory-ios"

[nodes."packages/calendar-engine"]
batch = "cli"

[nodes."packages/map-engine"]
batch = "cli"

[nodes."packages/map-renderer"]
batch = "packages"

[nodes."packages/entry-preview"]
batch = "packages"

[nodes."apps/calendars"]
batch = "web-2"

[suites.calendars-e2e]
node = "apps/calendars"
depends_on = ["apps/api"]

[nodes."apps/sessions"]
batch = "web-2"

[suites.sessions-e2e]
node = "apps/sessions"
depends_on = ["apps/api"]

[nodes."apps/maps"]
batch = "web-2"

[suites.maps-e2e]
node = "apps/maps"
depends_on = ["apps/api"]
