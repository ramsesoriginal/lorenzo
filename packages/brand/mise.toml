# packages/brand has no dependencies of its own to install - its only job
# is copying the whole apps/brand layout package in as a versioned, pnpm-
# workspace-installable set of files (see ADR 0098). That copy is
# .gitignore'd, never hand-edited, and regenerated by `build`.

# The actual copy is a plain node script (scripts/build.mjs), not a shell
# `cp`, and these tasks just call it via its own package.json script -
# Cloudflare Pages' build command for a consuming app (e.g.
# apps/inventory-web) is a bare `pnpm install && pnpm run build`, with no
# mise involved at all, so the copy has to work as a plain pnpm script,
# not only as a mise task (confirmed the hard way - see apps/inventory-web's
# own build failure this fixed. A previous version of this task ran `cp`
# directly and hit a Windows-only quirk on top of that - `mkdir` resolves
# to cmd.exe's own builtin there, which shadows Git-for-Windows' real
# mkdir.exe and doesn't understand `-p` - fs.cpSync in the node script
# sidesteps that entirely too).
[tasks.build]
description = "Copy the whole apps/brand package in (gitignored, see ADR 0098)"
run = "pnpm run build"

[tasks.clean]
description = "Remove the copied files, so nothing generated is left on disk"
run = "pnpm run clean"

[tasks.dev]
description = "Nothing to run - see apps/brand/preview for a live preview"
run = "echo 'packages/brand has no dev server - see apps/brand/preview/index.html.'"

[tasks.lint]
description = "Nothing to lint of its own - tokens.css is authored in apps/brand"
run = "echo 'packages/brand has nothing to lint of its own - see apps/brand.'"

[tasks.format]
description = "Nothing to format of its own - tokens.css is authored in apps/brand"
run = "echo 'packages/brand has nothing to format of its own - see apps/brand.'"

[tasks.test]
description = "No automated tests yet"
run = "echo 'packages/brand has no automated tests yet.'"
