# packages/brand has no dependencies of its own to install - its only job
# is copying the whole apps/brand layout package in as a versioned, pnpm-
# workspace-installable set of files (see ADR 0098). That copy is
# .gitignore'd, never hand-edited, and regenerated by `build`.

# A multi-line `run` string only executed its first line here (Windows
# mise shell-invocation quirk, same family as the root mise.toml's nested-
# quoting issue) - an array of separate steps is more portable. `mkdir`
# specifically must be avoided even so: on Windows it resolves to cmd.exe's
# own builtin (which shadows Git-for-Windows' real mkdir.exe and doesn't
# understand `-p`), unlike `cp`/`rm`, which aren't cmd.exe builtins and
# correctly resolve to the real executables on PATH either way.
[tasks.build]
description = "Copy the whole apps/brand package in (gitignored, see ADR 0098)"
run = [
  "cp ../../apps/brand/tokens.css ./tokens.css",
  "cp ../../apps/brand/fonts.css ./fonts.css",
  "cp ../../apps/brand/normalize.css ./normalize.css",
  "cp ../../apps/brand/base.css ./base.css",
  "cp ../../apps/brand/layout.css ./layout.css",
  "cp ../../apps/brand/components.css ./components.css",
  "cp ../../apps/brand/icons.svg ./icons.svg",
  "cp ../../apps/brand/icons.manifest.yaml ./icons.manifest.yaml",
  "rm -rf ./fonts",
  "cp -r ../../apps/brand/fonts ./fonts",
]

[tasks.clean]
description = "Remove the copied files, so nothing generated is left on disk"
run = "rm -f ./tokens.css ./fonts.css ./normalize.css ./base.css ./layout.css ./components.css ./icons.svg ./icons.manifest.yaml && rm -rf ./fonts"

[tasks.dev]
description = "Nothing to run - see apps/brand/preview for a live preview"
run = "echo 'packages/brand has no dev server - see apps/brand/preview/index.html.'"

[tasks.lint]
description = "Nothing to lint of its own - tokens.css is authored in apps/brand"
run = "echo 'packages/brand has nothing to lint of its own - see apps/brand.'"

[tasks.format]
description = "Nothing to format of its own - tokens.css is authored in apps/brand"
run = "echo 'packages/brand has nothing to format of its own - see apps/brand.'"

[tasks.test]
description = "No automated tests yet"
run = "echo 'packages/brand has no automated tests yet.'"
