# packages/brand has no dependencies of its own to install - its only job
# is copying apps/brand/tokens.css in as a versioned, pnpm-workspace-
# installable file (see ADR 0098). That copy is .gitignore'd, never
# hand-edited, and regenerated by `build`.

[tasks.build]
description = "Copy apps/brand/tokens.css in (gitignored, see ADR 0098)"
run = "cp ../../apps/brand/tokens.css ./tokens.css"

[tasks.clean]
description = "Remove the copied tokens.css, so nothing generated is left on disk"
run = "rm -f ./tokens.css"

[tasks.dev]
description = "Nothing to run - see apps/brand/preview for a live preview"
run = "echo 'packages/brand has no dev server - see apps/brand/preview/index.html.'"

[tasks.lint]
description = "Nothing to lint of its own - tokens.css is authored in apps/brand"
run = "echo 'packages/brand has nothing to lint of its own - see apps/brand.'"

[tasks.format]
description = "Nothing to format of its own - tokens.css is authored in apps/brand"
run = "echo 'packages/brand has nothing to format of its own - see apps/brand.'"

[tasks.test]
description = "No automated tests yet"
run = "echo 'packages/brand has no automated tests yet.'"
