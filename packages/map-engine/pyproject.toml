[project]
name = "lorenzo-map"
version = "0.1.0"
description = "The one validator of Lorenzo map systems and geometry (ADR 0336, 0337)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorenzo_map"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=2.3.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
