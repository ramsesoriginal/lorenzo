[project]
name = "lorenzo-calendar"
version = "0.0.0"
description = "Pure authored calendar calculation for Lorenzo (ADR 0308)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorenzo_calendar"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=2.3.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
