# The built-in seed (RFC 0025 R8 and R9, ADR 0143, 0146 and 0175): the item taxonomy, the stat groups
# and definitions, and the weight recipe that `lorenzo seed` finds-or-creates in a tenant.
#
# Every group, definition, node, recipe and attachment carries a `layer`, and each layer is one
# repository of RFC 0033 (ADR 0175):
#   core            - what can be said of a thing in any system: the root category, its weight
#                     recipe, and the ten neutral stats. Bare slugs.
#   equipment       - the forms (weapon, armor, the kinds of gear) and the materials. Built on core.
#                     Bare slugs.
#   dnd5e           - D&D 5e's rules: its stat groups and definitions, its categories and properties,
#                     under one system root. Built on core. Slugs prefixed `dnd5e-`.
#   dnd5e-equipment - what joins the equipment to D&D's rules: attachments of D&D's prototypes to
#                     the equipment's forms. Built on equipment and dnd5e. Slugs prefixed `dnd5e-`.
# An entry may name entries of its own layer or of a layer it is built on, never of a sibling's.
#
# Stat definitions and groups can't be renamed, retyped or removed once a tenant has them (no
# PATCH or DELETE, ADR 0014), and are frozen in every copy of a repository (ADR 0119, 0121):
# what is written here is chosen once. Changing a `value_type` later cannot be applied.
#
# A category is a prototype, so an item that has it inherits it: its tags (`is_finesse`), its
# stat values (`stats`, such as the price of 0 an economic object carries) and its description, which
# the item's view shows. "Every heavy weapon" is the backlinks of `dnd5e-heavy`.
#
# An `[[attachment]]` adds a parent to a category of another layer, which is what a repository that
# holds copies of both does (ADR 0172): it is a parent, in the layer that makes it.

schema = 1
version = "2"

# ---- stat groups: `physical`, `sourcebook` and `tags` are core's, which every layer builds on;
# `economic`, `damaging` and `destroyable` are D&D's, since every stat in them is -------------------

[[group]]
name = "physical"
layer = "core"

[[group]]
name = "tags"
layer = "core"

[[group]]
name = "sourcebook"
layer = "core"

[[group]]
name = "economic"
layer = "dnd5e"

[[group]]
name = "destroyable"
layer = "dnd5e"

[[group]]
name = "damaging"
layer = "dnd5e"

# ---- stat definitions: physical (the lengths in feet and the price below are D&D's) ---------------------------------------------------------------------

# MPMB's `weight` is written to `own_weight`, never to `weight`: `weight` is the recipe below
# (own weight plus what is inside), and a direct value would beat it and stop a container
# counting its contents. Floats, because MPMB has 0.05 and 0.2.
[[definition]]
name = "own_weight"
group = "physical"
value_type = "float"
layer = "core"

[[definition]]
name = "weight"
group = "physical"
value_type = "float"
layer = "core"

[[definition]]
name = "contents_weight"
group = "physical"
value_type = "float"
layer = "core"

[[definition]]
name = "range_normal"
group = "physical"
value_type = "int"
layer = "dnd5e"

[[definition]]
name = "range_long"
group = "physical"
value_type = "int"
layer = "dnd5e"

# How many of a thing one entry is: a bundle of 20 arrows, 50 feet of rope. The weight above
# already counts them all.
[[definition]]
name = "bundle_amount"
group = "physical"
value_type = "int"
layer = "core"

