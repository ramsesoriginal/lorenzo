# ---- the weight recipe, on the base of the form tree (docs/reference/well-known-stats.md) ---------------

# contents_weight = contents(weight): what the things directly inside weigh, times how many.
[[recipe]]
node = "physical-object"
stat = "contents_weight"
kind = "contents"
source = "weight"
layer = "core"

# weight = sum(own_weight, contents_weight). A direct `weight` on a thing (a Bag of Holding)
# beats this inherited formula, so its contents don't weigh on its carrier.
[[recipe]]
node = "physical-object"
stat = "weight"
kind = "sum"
terms = ["own_weight", "contents_weight"]
layer = "core"
