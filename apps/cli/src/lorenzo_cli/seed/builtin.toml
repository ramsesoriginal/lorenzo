name = "D&D 5e"
layer = "dnd5e"
description = "Everything that belongs to the D&D 5e rules: its proficiencies, tiers, properties, foci and economics descend from this, so a thing is a D&D 5e thing exactly when it has this among its ancestors."

# What D&D gives a price: a price in copper pieces, 0 until a more specific category or the item sets
