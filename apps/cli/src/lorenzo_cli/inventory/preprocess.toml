# What the importer tries when a name matches no item (ADR 0193): the same name written another way.
# It is data, and it grows as GMs find gaps; `lorenzo inventory import --preprocess FILE` adds a
# table of one's own, in this shape, on top of it.
#
# `names` is a whole name and what it may be called in the catalog: one title, or a list tried in
# order. `words` is one word and its translation, for names that are a few words long. Both are
# compared without case. Before a name is looked up, a bracket, a length ("50 ft", "16m") and
# `$math$` are taken off it and a plural made singular, so "Ropes (old)" is looked up as "rope".
#
# The titles are the D&D 5e equipment's, as the SRD and the character sheets write them ("Rope,
# hempen (50 feet)"). A library that names things otherwise adds its own table.
#
# Gear a table does not know stays an unsorted item, which is what the GM's view is for: homebrew,
# creatures and one-offs are deliberately not here.

[names]
# ---- weapons and ammunition -------------------------------------------------------------------
"crossbow bolts" = ["crossbow bolts (20)", "bolts (20)", "crossbow bolt", "bolt"]
"normal pistol bullets" = ["bullets, firearm (10)", "bullets, firearm"]
"normal pistole bullets" = ["bullets, firearm (10)", "bullets, firearm"]
"normal musket bullets" = ["bullets, firearm (10)", "bullets, firearm"]
"heavy crossbow" = "crossbow, heavy"
"hand crossbow" = "crossbow, hand"
"light crossbow" = "crossbow, light"
"schwere armbrust" = "crossbow, heavy"
"leichte armbrust" = "crossbow, light"
"great sword" = "greatsword"
"battle axe" = "battleaxe"
"lanbogen" = "longbow"
"scimital" = "scimitar"

# ---- armour and clothes -----------------------------------------------------------------------
"common clothes" = "clothes, common"
"cloak of dissplacement" = "cloak of displacement"
"ring of magic resistance" = "ring of resistance"

# ---- adventuring gear -------------------------------------------------------------------------
"rations" = ["rations (1 day)"]
"day rations" = ["rations (1 day)"]
"tinder box" = "tinderbox"
"zunderbüchse" = "tinderbox"
"flint 'n steel" = ["flint and steel", "tinderbox"]
"belt pouch" = ["pouch"]
"münzbeutel" = ["pouch"]
"hooded lantern" = "lantern, hooded"
"vial of acid" = ["acid (vial)", "acid"]
"holy symbol" = ["holy symbol (amulet)", "holy symbol (emblem)", "holy symbol (reliquary)"]
"sticks of incense" = ["incense (block)", "incense"]
"alarm sanduhr" = ["hourglass"]
"bottle of black ink" = ["ink (1 ounce bottle)", "ink"]
"quill" = ["ink pen", "quill"]
"chalk" = ["chalk (1 piece)"]
"paper" = ["paper (one sheet)"]
"ball bearings" = ["ball bearings (bag of 1,000)"]
"saddle bag" = ["saddlebags"]
"saddle" = ["saddle, riding"]
"light brown riding horse" = ["riding horse"]
"enterhacken" = "grappling hook"
"playing card set" = ["playing card set", "playing cards"]

# ---- rope ---------------------------------------------------------------------------------------
# A length ("16m", "50 ft") comes off before these are looked up, so they are the rope itself.
"rope, hempen" = ["rope, hempen (50 feet)", "rope, hempen"]
"untrustworthy rope, hempen" = ["rope, hempen (50 feet)"]
"hanfseil" = ["rope, hempen (50 feet)"]
"hempen rope" = ["rope, hempen (50 feet)"]
"seil" = ["rope, hempen (50 feet)", "rope"]
"seidenseil" = ["rope, silk (50 feet)"]
"seide seil" = ["rope, silk (50 feet)"]
"silk rope" = ["rope, silk (50 feet)"]

# ---- tools --------------------------------------------------------------------------------------
"climbers kit" = "climber's kit"
"miners pick" = ["miner's pick", "pick, miner's"]
"pickaxe" = ["pick, miner's", "miner's pick"]
"sledgehammer" = ["hammer, sledge"]
"tinkers tools" = "tinker's tools"

# ---- potions, scrolls and magic ---------------------------------------------------------------
"heiltrank" = "potion of healing"
"trank der heilung" = "potion of healing"
"großer heiltrank" = "potion of greater healing"
"poition of greater healing" = "potion of greater healing"
"dimension door scroll" = ["spell scroll (dimension door)", "scroll of dimension door"]
"manual of iron golem" = ["manual of golems"]

# ---- valuables ----------------------------------------------------------------------------------
"pearl" = ["pearl (100 gp)"]
"emerald" = ["emerald (100 gp)"]
"goldbarren" = ["gold bar", "ingot, gold"]

# ---- the animals' tack and the like -------------------------------------------------------------
"fass" = ["barrel"]

