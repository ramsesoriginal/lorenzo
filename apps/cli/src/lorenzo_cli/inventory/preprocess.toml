# What the importer tries when a name matches no item (ADR 0193): the same name written another way.
# It is data, and it grows as GMs find gaps; `lorenzo inventory import --preprocess FILE` adds a
# table of one's own, in this shape, on top of it.
#
# `names` is a whole name and what it may be called in the catalog: one title, or a list tried in
# order. `words` is one word and its translation, for names that are a few words long. Both are
# compared without case. Before a name is looked up, a bracket, a length ("50 ft", "16m") and
# `$math$` are taken off it and a plural made singular, so "Ropes (old)" is looked up as "rope".
#
# The titles are the D&D 5e equipment's, as the SRD and the character sheets write them ("Rope,
# hempen (50 feet)"). A library that names things otherwise adds its own table.
#
# Gear a table does not know stays an unsorted item, which is what the GM's view is for: homebrew,
# creatures and one-offs are deliberately not here.

[names]
