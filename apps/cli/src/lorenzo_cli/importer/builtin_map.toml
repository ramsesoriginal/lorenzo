# The built-in mapping (RFC 0025 R5, ADR 0144 and 0146): what each MPMB value means in Lorenzo terms.
# A project map file (same format) overlays this one: its rows win, key by key.
#
# Read it as data, not as code. Values are matched exactly, case-insensitively. A value with no
# row, and no "*" fallback, is not guessed at: the item is held for review.
#
# Nothing the source says is dropped without a reason: what has a place in the model goes there
# (a stat, a category, an entry of its own), and `drop` is kept for what only the PDF needs.
#
# Every item has two halves (ADR 0182): the neutral one, true anywhere (its name, weight, forms,
# materials, other names), and the system's, D&D's (its price, dice, proficiency, properties).
# `lorenzo apply --part neutral` writes the first into the common equipment; `--part system`
# writes the second as a prototype attached to it. Which half a thing is in is decided by the seed:
# a stat has the part of its definition's layer, a category the part of its node's, a category a
# row mints the part of its axis. A row says `part = "neutral" | "system"` only for what no layer
# decides, such as text: here a weapon's description (a property list) and its special rules.
# `[system_namespaces]` and `[system] label` in a project map name the prototypes' slugs and names.

schema = 1
version = "2"

# How many copper pieces one unit of each currency is worth. Prices are stored in copper.
[currencies]
cp = 1
sp = 10
ep = 50
gp = 100
pp = 1000

# ---- per list: the form every item of that list has, and where a new category goes -------------

[lists.weapons]
form = ["weapon"]
# A weapon must come out melee or ranged, or have a row that says it is neither.
reach_required = true
[lists.weapons.roots]
form = "physical-object"
proficiency = "dnd5e-weapon-proficiency"
property = "dnd5e-weapon-property"
material = "material"

[lists.armour]
form = ["armor"]
[lists.armour.roots]
form = "physical-object"
tier = "dnd5e-armor-tier"
material = "material"

[lists.gear]
form = ["gear"]
[lists.gear.roots]
form = "physical-object"

[lists.tools]
form = ["tool"]
[lists.tools.roots]
form = "physical-object"
proficiency = "dnd5e-tool-proficiency"

[lists.ammo]
form = ["ammunition"]
[lists.ammo.roots]
form = "physical-object"

[lists.packs]
form = ["gear"]
[lists.packs.roots]
form = "physical-object"

# ---- classification: an attribute's value -> parents, or skip -------------------------------------
# A row is a list of parent slugs (map), or a table with a `disposition`:
#   map                a list of `parents`
#   skip               not an item; leave it out
#   attach-form-only   only the list's form; mark the item uncategorised
#   create-under       mint a category under an axis root (axis, slug, name)
#   fail               refuse, so nobody imports it by accident
# `replace_form = true` drops the list's own form in favour of the row's parents.

# A weapon's `type` is a proficiency category, an open vocabulary, not melee/ranged.
[classify.weapons.type]
simple = ["dnd5e-simple"]
martial = ["dnd5e-martial"]
exotic = ["dnd5e-exotic"]
"improvised weapons" = ["dnd5e-improvised"]
# Not items: a bare hand, a spell attack, cantrips the sheet lists as attacks.
natural = "skip"
cantrip = "skip"
spell = "skip"
alwaysprof = "skip"

# `list` says melee or ranged, when it says anything. What `range` says is used as well
# (a dagger is melee and, thrown, ranged), so `improvised` needs no reach of its own.
[classify.weapons.list]
melee = ["melee-weapon"]
ranged = ["ranged-weapon"]
firearm = ["firearm"]
improvised = []
spell = "skip"

# `special = true` marks a weapon with rules of its own; the rules are in its `tooltip`.
[classify.weapons.special]
"true" = ["dnd5e-special"]
"false" = []

# Armour `type` is light, medium or heavy, and absent for what isn't armour that is worn.
[classify.armour.type]
light = ["dnd5e-light-armor"]
medium = ["dnd5e-medium-armor"]
heavy = ["dnd5e-heavy-armor"]

# `firstlist` (unarmoured) and `magic` (mage armor) are ways the sheet works out AC, not items.
[classify.armour.list]
firstlist = "skip"
magic = "skip"

[classify.tools.type]
"artisan's tools" = ["dnd5e-artisans-tools"]
"gaming set" = ["dnd5e-gaming-set"]
"musical instrument" = ["dnd5e-musical-instrument"]

# Gear that comes as a bundle of ammunition is ammunition. A focus, clothes and a saddle each have
# a category. Any other kind is gear, and needs none of its own.
[classify.gear.type]
ammunition = { parents = ["ammunition"], replace_form = true }
clothes = ["clothing"]
saddle = ["tack"]
"arcane focus" = ["dnd5e-arcane-focus"]
"druidic focus" = ["dnd5e-druidic-focus"]
"holy symbol" = ["dnd5e-holy-symbol"]
"*" = "attach-form-only"

# ---- text rules: what the source doesn't say as a field, from its words ----------------------------
# Every rule that matches applies, except that of the rules sharing a `group` only the first does.
# `starts_with` compares a prefix, `contains` a substring, `words` a whole word (a hyphen is part of
# a word). `attribute` is what is read; the item's name by default.

# -- weapons: what kind of weapon it is (one kind: the first that fits) --
[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["crossbow"]
parents = ["crossbow"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["bow"]
parents = ["bow"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["sling"]
parents = ["sling"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["axe"]
parents = ["axe"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["hammer", "maul"]
parents = ["hammer"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["sword", "rapier", "scimitar", "dagger", "sickle", "blade", "knife"]
parents = ["blade"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["club", "mace", "flail", "morningstar", "staff"]
parents = ["bludgeon"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["glaive", "halberd", "pike", "lance"]
parents = ["polearm"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["spear", "javelin", "trident"]
parents = ["spear"]

[[name_rule]]
in_list = "weapons"
group = "family"
contains = ["whip"]
parents = ["whip"]

# -- weapons: the properties the description lists ("Finesse, light, thrown") --
[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["finesse"]
parents = ["dnd5e-finesse"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["heavy"]
parents = ["dnd5e-heavy"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["light"]
parents = ["dnd5e-light"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["loading"]
parents = ["dnd5e-loading"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["reach"]
parents = ["dnd5e-reach"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["special"]
parents = ["dnd5e-special"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["thrown"]
parents = ["dnd5e-throwable"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["two-handed"]
parents = ["dnd5e-two-handed"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["versatile"]
parents = ["dnd5e-versatile"]

[[name_rule]]
in_list = "weapons"
attribute = "description"
words = ["ammunition"]
parents = ["dnd5e-uses-ammunition"]

# -- what it is made of --
[[name_rule]]
in_list = "weapons"
words = ["silvered"]
parents = ["silvered"]

[[name_rule]]
in_list = "weapons"
words = ["adamantine"]
parents = ["adamantine"]

[[name_rule]]
in_list = "armour"
words = ["silvered"]
parents = ["silvered"]

[[name_rule]]
in_list = "armour"
words = ["adamantine"]
parents = ["adamantine"]

[[name_rule]]
in_list = "armour"
starts_with = ["shield"]
parents = ["shield"]

# -- gear: kinds of gear, from a curated list of names --
[[name_rule]]
in_list = "gear"
starts_with = [
  "backpack", "barrel", "basket", "bucket", "case", "chest", "component pouch", "pouch",
  "quiver", "sack",
]
parents = ["container"]

[[name_rule]]
in_list = "gear"
starts_with = [
  "acid", "alchemist's fire", "animal feed", "antitoxin", "candle", "chalk", "holy water",
  "incense", "ink (", "oil", "paper", "parchment", "perfume", "poison", "potion", "rations",
  "sealing wax", "soap", "torch",
]
parents = ["consumable"]

[[name_rule]]
in_list = "gear"
starts_with = ["robes"]
parents = ["clothing"]

[[name_rule]]
in_list = "gear"
starts_with = ["rope", "piton", "grappling hook", "climber's kit", "block and tackle", "ladder"]
parents = ["climbing"]

[[name_rule]]
in_list = "gear"
starts_with = ["fishing tackle", "spyglass"]
parents = ["nautical"]

[[name_rule]]
in_list = "gear"
starts_with = ["candle", "lamp", "lantern", "torch", "tinderbox"]
parents = ["lighting"]

[[name_rule]]
in_list = "gear"
starts_with = ["ink", "paper", "parchment", "sealing wax", "book", "spellbook"]
parents = ["writing"]

[[name_rule]]
in_list = "gear"
starts_with = ["bedroll", "blanket", "mess kit", "tent", "hunting trap", "waterskin"]
parents = ["camping"]

[[name_rule]]
in_list = "gear"
starts_with = ["bit and bridle", "saddlebags"]
parents = ["tack"]

[[name_rule]]
in_list = "gear"
starts_with = ["healer's kit", "antitoxin", "potion of healing"]
parents = ["medicine"]

[[name_rule]]
in_list = "gear"
starts_with = ["component pouch"]
parents = ["dnd5e-spellcasting-focus"]

# ---- attributes: what each MPMB attribute becomes ---------------------------------------------------------
# A rule is a transform's name, a table `{ transform = "...", ...parameters }`, or a list of them
# when an attribute means several things. The set of transforms is closed (see ADR 0144, 0146); a
# new kind of extraction is a code change, a new attribute is a row. `drop` says the attribute has
# no meaning here and is not worth mentioning. An attribute with no rule is reported (it never
# blocks the item).

[attributes.weapons]
name = "name"
source = "sourcebook"
weight = "own_weight"
# The text is the description; "Versatile (1d10)" also gives the two-handed die.
description = [
  { transform = "description", part = "system" },
  { transform = "regex_extract", pattern = "(?i)versatile \\(1d(\\d+)\\)", group = 1, stat = "damage_versatile_die", as = "int", examples = [{ input = "Versatile (1d10)", output = "10" }, { input = "Finesse, versatile (1d8)", output = "8" }] },
]
damage = "damage"
range = "range"
type = "classify"
list = "classify"
special = "classify"
# What the weapon draws on ("arrow"). A thrown flask names itself, so this alone does not make a
# weapon one that uses ammunition: the description's word "Ammunition" does.
ammo = { transform = "text", stat = "ammo_type" }
ability = { transform = "ability_name", stat = "attack_ability" }
abilitytodamage = { transform = "bool", stat = "ability_to_damage" }
monkweapon = { transform = "bool", stat = "is_monk_weapon" }
isNotWeapon = { transform = "bool", stat = "is_not_weapon" }
dc = { transform = "bool", stat = "has_save_dc" }
baseWeapon = { transform = "text", stat = "base_weapon" }
tooltip = { transform = "information", type = "note", title = "Special rules", part = "system" }
nameAlt = "aliases"
# What the PDF uses to recognise the weapon in a text field; nothing here needs it.
regExpSearch = "drop"

[attributes.armour]
name = "name"
invName = "name"
source = "sourcebook"
weight = "own_weight"
ac = "armor"
type = "classify"
list = "classify"
strReq = { transform = "int", stat = "strength_required", minimum = 1 }
stealthdis = { transform = "bool", stat = "stealth_disadvantage" }
addMod = { transform = "bool", stat = "adds_modifier" }
affectsWildShape = { transform = "bool", stat = "affects_wild_shape" }
isMagicArmor = { transform = "bool", stat = "is_magical" }
regExpSearch = "drop"

[attributes.gear]
infoname = "name_and_price"
# The inventory name; it is kept among the item's other names.
name = "drop"
amount = { transform = "int", stat = "bundle_amount", minimum = 2 }
weight = "own_weight"
type = "classify"

[attributes.tools]
infoname = "name_and_price"
name = "drop"
amount = "drop"
weight = "own_weight"
type = "classify"

[attributes.ammo]
name = "name"
invName = "name"
source = "sourcebook"
weight = "own_weight"
isMagicAmmo = { transform = "bool", stat = "is_magical" }
alternatives = "aliases"
# A picture for the sheet's ammunition counter, and what it uses to recognise the ammunition.
icon = "drop"
regExpSearch = "drop"

[attributes.packs]
name = "name_and_price"
source = "sourcebook"
items = "pack_contents"

# ---- pack contents: a pack lists its items by display name, not by key ---------------------------------------------
# A name is looked up exactly (case-insensitively) among the names of the items in the run. A row here
# answers the ones that don't match: "list:key" links to that entry; "item" says it is a plain item
# of its own (the importer makes it). Every line of a pack links to an item (ADR 0150).
# A name nothing answers is made a plain item as well, and reported, so it can be linked instead.

[pack_items]
"candles" = "gear:candle"
"pitons" = "gear:piton"
"torches" = "gear:torch"
"costumes" = "gear:costume"
"perfume, vial of" = "gear:perfume (vial)"
# The sheet's light-hammer ammunition also answers to "hammer".
"hammer" = "gear:hammer"
# The sheet has no gear entry for these, only the packs that mention them.
"string, feet of" = "item"
"alms box" = "item"
"incense, blocks of" = "item"
"censer" = "item"
"vestments" = "item"
"book of lore" = "item"
"little bag of sand" = "item"
