# The neutral starter (ADR 0505): what is true of a thing in any game. Physical stats with
# their roles, the weight recipe, the forms and materials of equipment, and the placeholder
# for a player's own item. Apply it to a repository, publish it, and let libraries copy it.

format = 1
name = "neutral"
group = [
    { name = "physical", role = "physical" },
    { name = "tags", role = "tags" },
    { name = "sourcebook" },
]
stat = [
    { name = "own_weight", group = "physical", type = "float" },
    { name = "weight", group = "physical", type = "float", role = "weight" },
    { name = "contents_weight", group = "physical", type = "float" },
    { name = "height", group = "physical", type = "float", role = "height" },
    { name = "bundle_amount", group = "physical", type = "int" },
    { name = "is_container", group = "tags", type = "bool", role = "is_container" },
    { name = "is_consumable", group = "tags", type = "bool" },
    { name = "is_magical", group = "tags", type = "bool" },
    { name = "is_silvered", group = "tags", type = "bool" },
    { name = "is_adamantine", group = "tags", type = "bool" },
    { name = "sourcebook", group = "sourcebook", type = "text" },
]

