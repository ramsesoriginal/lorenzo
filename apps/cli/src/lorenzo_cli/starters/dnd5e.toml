[[entry]]
slug = "dnd5e-armor-class-features"
name = "Armor class features (D&D 5e)"
parents = [
    "dnd5e-system",
]
description = "Features that give another way of working out armor class. A feature takes a way by its tag (10 + Dexterity + Constitution, 10 + Dexterity + Wisdom, or 13 + Dexterity) or a natural armor class; while the holder wears no body armor, the best way that applies is its armor class. A race's, a class's or a magic item's feature joins by carrying the same tag."

[[entry]]
slug = "dnd5e-unarmored-defense-barbarian"
name = "Unarmored Defense (Barbarian)"
kinds = [
    "feature",
]
parents = [
    "dnd5e-armor-class-features",
]
tags = [
    "dnd5e_ac_10_dex_con",
]
description = "While you are not wearing any armor, your Armor Class equals 10 + your Dexterity modifier + your Constitution modifier. You can use a shield and still gain this benefit."

[[entry]]
slug = "dnd5e-unarmored-defense-monk"
name = "Unarmored Defense (Monk)"
kinds = [
