source = "dnd5e_level"
mode = "threshold"
steps = [
    { from = 1, result = { number = 2 } },
    { from = 5, result = { number = 3 } },
    { from = 9, result = { number = 4 } },
    { from = 13, result = { number = 5 } },
    { from = 17, result = { number = 6 } },
]

# Armor class from what is worn (switched on): the best body armor (10 with none), the lowest
# Dexterity cap among it (none without), and the best shield.
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_armor_base"
kind = "contents"
source = "dnd5e_armor"
aggregate = "max"
only_active = true
where = "dnd5e_is_body_armor"
if_none = 10

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_dexterity_cap"
kind = "contents"
source = "dnd5e_dexterity_cap"
aggregate = "min"
only_active = true
where = "dnd5e_is_body_armor"
if_none = 99

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_shield_bonus"
kind = "contents"
source = "dnd5e_armor"
aggregate = "max"
only_active = true
where = "dnd5e_is_shield"
if_none = 0

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_armor_dexterity"
kind = "min"
inputs = [
    "dnd5e_dexterity_mod",
    "dnd5e_dexterity_cap",
]

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_armor_class_worn"
kind = "sum"
terms = [
    "dnd5e_armor_base",
    "dnd5e_armor_dexterity",
    "dnd5e_shield_bonus",
]

# Whether body armor or a shield is worn, for the ways that ask.
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_body_armor_count"
kind = "contents"
aggregate = "count"
only_active = true
only_kind = "item_instance"
where = "dnd5e_is_body_armor"

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_unarmored"
kind = "comparison"
left = "dnd5e_body_armor_count"
comparator = "eq"
right_constant = 0

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_no_shield"
kind = "comparison"
left = "dnd5e_shield_bonus"
comparator = "eq"
right_constant = 0

# 10 + Dexterity + Constitution, a shield allowed (a Barbarian's Unarmored Defense).
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_10_dex_con_count"
kind = "contents"
aggregate = "count"
only_active = true
where = "dnd5e_ac_10_dex_con"

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_10_dex_con_held"
kind = "comparison"
left = "dnd5e_ac_10_dex_con_count"
comparator = "ge"
right_constant = 1

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_10_dex_con_value"
kind = "sum"
terms = [
    "dnd5e_dexterity_mod",
    "dnd5e_constitution_mod",
    "dnd5e_shield_bonus",
]
offset = 10

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_by_10_dex_con"
kind = "product"
factors = [
    "dnd5e_ac_10_dex_con_held",
    "dnd5e_unarmored",
    "dnd5e_ac_10_dex_con_value",
]

# 10 + Dexterity + Wisdom, no shield (a Monk's Unarmored Defense).
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_10_dex_wis_count"
kind = "contents"
aggregate = "count"
only_active = true
where = "dnd5e_ac_10_dex_wis"

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_10_dex_wis_held"
kind = "comparison"
left = "dnd5e_ac_10_dex_wis_count"
comparator = "ge"
right_constant = 1

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_10_dex_wis_value"
kind = "sum"
terms = [
    "dnd5e_dexterity_mod",
    "dnd5e_wisdom_mod",
]
offset = 10

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_by_10_dex_wis"
kind = "product"
factors = [
    "dnd5e_ac_10_dex_wis_held",
    "dnd5e_unarmored",
    "dnd5e_no_shield",
    "dnd5e_ac_10_dex_wis_value",
]

# 13 + Dexterity, a shield allowed (Mage Armor, Draconic Resilience, a race's natural armor).
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_13_dex_count"
kind = "contents"
aggregate = "count"
only_active = true
where = "dnd5e_ac_13_dex"

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_13_dex_held"
kind = "comparison"
left = "dnd5e_ac_13_dex_count"
comparator = "ge"
right_constant = 1

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_13_dex_value"
kind = "sum"
terms = [
    "dnd5e_dexterity_mod",
    "dnd5e_shield_bonus",
]
offset = 13

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_by_13_dex"
kind = "product"
factors = [
    "dnd5e_ac_13_dex_held",
    "dnd5e_unarmored",
    "dnd5e_ac_13_dex_value",
]

# A natural armor class a feature names (no Dexterity), a shield allowed.
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_natural_best"
kind = "contents"
source = "dnd5e_ac_natural"
aggregate = "max"
only_active = true
if_none = 0

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_natural_value"
kind = "sum"
terms = [
    "dnd5e_ac_natural_best",
    "dnd5e_shield_bonus",
]

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_by_natural"
kind = "product"
factors = [
    "dnd5e_unarmored",
    "dnd5e_ac_natural_value",
]

# The armor class: the best of the ways that apply (a way that does not apply is 0).
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_armor_class_best"
kind = "max"
inputs = [
    "dnd5e_armor_class_worn",
    "dnd5e_ac_by_10_dex_con",
    "dnd5e_ac_by_10_dex_wis",
    "dnd5e_ac_by_13_dex",
    "dnd5e_ac_by_natural",
]

# The bonuses of what is held, switched on: features and items alike.
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_bonus_total"
kind = "contents"
source = "dnd5e_ac_bonus"
aggregate = "sum"
only_active = true

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_bonus_armored_total"
kind = "contents"
source = "dnd5e_ac_bonus_armored"
aggregate = "sum"
only_active = true

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_armored"
kind = "comparison"
left = "dnd5e_body_armor_count"
comparator = "ge"
right_constant = 1

[[formula]]
on = "dnd5e-character"
stat = "dnd5e_ac_bonus_armored_applied"
kind = "product"
factors = [
    "dnd5e_armored",
    "dnd5e_ac_bonus_armored_total",
]

# The armor class: the best way that applies, and the bonuses on top.
[[formula]]
on = "dnd5e-character"
stat = "dnd5e_armor_class"
kind = "sum"
terms = [
    "dnd5e_armor_class_best",
    "dnd5e_ac_bonus_total",
    "dnd5e_ac_bonus_armored_applied",
]

