# The Wrath & Glory starter (ADR 0491). Requires the neutral starter.
# Mechanics, numbers and stat names only: no rules text, setting text or setting names. The
# attributes and skills, the traits' formulas, the bounds and the wargear profile were checked
# against the core rulebook and its character sheets. The species, the 27 archetypes, their
# abilities and the talents of the core rulebook are here by name, cost, ratings, requirements
# and page: what each does is in the book.

format = 1
name = "wrath-and-glory"
requires = [
    "neutral",
]
group = [
    { name = "wg_attributes", system = true },
    { name = "wg_skills", system = true },
    { name = "wg_traits", system = true },
    { name = "wg_pools", system = true },
    { name = "wg_progress", system = true },
    { name = "wg_steps", system = true },
    { name = "wg_gear", system = true },
    { name = "wg_features", system = true },
]

