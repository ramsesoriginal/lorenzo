# The Wrath & Glory starter (ADR 0491). Requires the neutral starter.
# Mechanics, numbers and stat names only: no rules text, setting text or setting names. The
# values (bounds, the traits' formulas, the dice pools) are written from the rules as the
# maintainer reviews them; check them against your rulebook. The archetype and the talents
# are examples to rename and fill.

format = 1
name = "wrath-and-glory"
requires = [
    "neutral",
]
group = [
    { name = "wg_attributes", system = true },
    { name = "wg_skills", system = true },
    { name = "wg_traits", system = true },
    { name = "wg_pools", system = true },
    { name = "wg_progress", system = true },
    { name = "wg_gear", system = true },
    { name = "wg_features", system = true },
]

