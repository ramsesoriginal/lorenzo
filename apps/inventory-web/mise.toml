# CI (ci.yml's `test` job) only runs `mise run lint`/`test` per discovered
# app, with no separate install step — unlike apps/api's `uv run`, plain
# `pnpm run` doesn't auto-sync node_modules, so every task depends on this
# one to stay self-sufficient the same way.
[tasks.install]
description = "Install dependencies (frozen lockfile)"
run = "pnpm install --frozen-lockfile"
hide = true

[tasks.dev]
description = "Run the Astro dev server"
depends = ["install"]
run = "pnpm run dev"

[tasks.lint]
description = "Biome (ts/js/json/css) + astro check + Prettier check (.astro) — see ADR 0004"
depends = ["install"]
run = "pnpm run lint"

[tasks.format]
description = "Biome autoformat + Prettier autoformat (.astro)"
depends = ["install"]
run = "pnpm run format"

[tasks.test]
description = "Run the test suite"
depends = ["install"]
run = "pnpm run test"

[tasks.build]
description = "Build the static site to dist/"
depends = ["install"]
run = "pnpm run build"
