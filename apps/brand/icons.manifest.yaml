# Aliases - reuse an existing symbol id above, not a new one:
#   icon-remove            -> icon-close   (removing a chip/tag)
#   icon-clear-selection   -> icon-close   (clearing a bulk-selection toolbar)
#   icon-rename             -> icon-edit    (rename-in-place is still an edit)
#   icon-look-up            -> icon-search  (the invite picker's email/nickname lookup)
#   icon-mark-read          -> icon-select-item (both are a plain confirmation checkmark)
#   icon-invite             -> icon-reassign (both read as "assign a person," add vs. reassign)
#   icon-restricted         -> icon-private (identity.md §6.6's --visibility-restricted-* naming)
#
# Added with the Bench icons (ADR 0274):
#   icon-kind-being-add         -> the existing icon-reassign (a person added)
#   icon-kind-being-remove      -> the existing icon-unassign (a person removed)
#   icon-kind-entity-alert      -> icon-warning
#   icon-kind-group-alert       -> icon-error
#   icon-kind-group-info        -> icon-info
#   icon-kind-group-unknown     -> icon-help
#   icon-audience-gm            -> icon-private (a note only the GM reads)
#   icon-audience-everyone      -> icon-eye (a note everyone reads)
#   icon-audience-some          -> icon-kind-beings (a note some characters read)
#   icon-audience-player        -> icon-kind-being (a player's own note)
#   icon-being                  -> icon-kind-being
#   icon-increase               -> icon-add (the plus beside a decrease)
#   icon-synced                 -> icon-select-item (Synced: the plain check)
