[project]
name = "lorenzo-api"
version = "0.2.0"
description = "Lorenzo backend REST API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0",
  "fastapi-problem>=0.12.1",
  "fastapi-pagination>=0.15.16",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=2.3.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI relies on `Depends(...)` as an argument default; ruff's
# generic "no function calls in defaults" check (B008) doesn't know
# that FastAPI special-cases these, so it's a false positive here.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session, not one per test function: the app's
# async engine/pool is module-level and created lazily on first use, so a
# second test under a fresh per-function loop would try to reuse a connection
# still bound to the first test's loop and fail with "attached to a
# different loop" - confirmed the hard way once a second DB-touching test
# existed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorenzo_api"]
