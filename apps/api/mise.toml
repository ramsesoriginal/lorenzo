[tasks.dev]
description = "Run the API with autoreload"
run = "uv run fastapi dev src/lorenzo_api/main.py"

[tasks.lint]
description = "Lockfile freshness + ruff check + format check + mypy"
run = ["uv lock --check", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy src"]

[tasks.format]
description = "Ruff autoformat"
run = "uv run ruff format ."

[tasks.test]
description = "Run the test suite with coverage"
run = "uv run pytest --cov"

[tasks.build]
description = "Build the container image"
run = "docker build -t lorenzo-api ."

[tasks.dev-token]
description = "Get a real Authgear access token for local testing (see docs/operations/local-authgear-setup.md)"
run = "uv run python scripts/get_dev_token.py"

[tasks.openapi-schema]
description = "Dump this app's current OpenAPI schema to openapi.json"
run = "uv run python scripts/dump_openapi_schema.py"
