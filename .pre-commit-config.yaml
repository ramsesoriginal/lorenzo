repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  # mypy needs the project's own dependencies (Pydantic plugin, stubs) on its
  # path, which the official pre-commit mirror doesn't give it without
  # duplicating them here - running it through the project's own toolchain
  # is the same reasoning as the ruff hooks above.
  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (apps/api)
        entry: uv run --directory apps/api mypy src
        language: system
        files: ^apps/api/src/.*\.py$
        pass_filenames: false

  # Same tools, same exclusions, same versions as docs.yml - if these fail
  # here, they'd fail in CI too. Pre-push rather than pre-commit: slower than
  # the hooks above, and only worth running once, right before it'd
  # otherwise fail remotely. The .venv/node_modules exclusions don't exist in
  # docs.yml because a fresh CI checkout never has them - a real local
  # working copy usually does, and both tools would otherwise flag every
  # installed dependency's own vendored markdown.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (matches docs.yml)
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        args:
          [
            "**/*.md",
            "!**/CHANGELOG.md",
            "!**/.venv/**",
            "!**/node_modules/**",
          ]

  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        name: lychee (matches docs.yml)
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        args:
          [
            "--no-progress",
            "--exclude",
            "localhost",
            "--exclude-path",
            "CHANGELOG\\.md$",
            "--exclude-path",
            "\\.venv",
            "--exclude-path",
            "node_modules",
            "**/*.md",
          ]

  # Same reasoning as the mypy-api hook above: Biome/astro check/prettier
  # need this app's own node_modules (tsconfig path resolution, the astro
  # language service, installed plugins) on their path, which the official
  # pre-commit mirrors don't give them without duplicating a package
  # install here too.
  - repo: local
    hooks:
      - id: biome-account-hub
        name: biome (apps/account-hub)
        entry: pnpm --dir apps/account-hub exec biome check --write
        language: system
        files: ^apps/account-hub/.*\.(ts|js|json|css)$
        pass_filenames: false
      - id: astro-check-account-hub
        name: astro check (apps/account-hub)
        entry: pnpm --dir apps/account-hub exec astro check
        language: system
        files: ^apps/account-hub/.*\.(astro|ts)$
        pass_filenames: false
      - id: prettier-account-hub
        name: prettier --write (apps/account-hub, .astro)
        entry: pnpm --dir apps/account-hub exec prettier --write
        language: system
        files: ^apps/account-hub/.*\.astro$
        pass_filenames: false
      - id: biome-inventory-web
        name: biome (apps/inventory-web)
        entry: pnpm --dir apps/inventory-web exec biome check --write
        language: system
        files: ^apps/inventory-web/.*\.(ts|js|json|css)$
        pass_filenames: false
      - id: astro-check-inventory-web
        name: astro check (apps/inventory-web)
        entry: pnpm --dir apps/inventory-web exec astro check
        language: system
        files: ^apps/inventory-web/.*\.(astro|ts)$
        pass_filenames: false
      - id: prettier-inventory-web
        name: prettier --write (apps/inventory-web, .astro)
        entry: pnpm --dir apps/inventory-web exec prettier --write
        language: system
        files: ^apps/inventory-web/.*\.astro$
        pass_filenames: false
      - id: biome-loot-bot
        name: biome (apps/loot-bot)
        entry: pnpm --dir apps/loot-bot exec biome check --write
        language: system
        files: ^apps/loot-bot/.*\.(ts|js|json)$
        pass_filenames: false
      - id: tsc-loot-bot
        name: tsc --noEmit (apps/loot-bot)
        entry: pnpm --dir apps/loot-bot exec tsc --noEmit
        language: system
        files: ^apps/loot-bot/.*\.ts$
        pass_filenames: false
      # apps/brand has no package.json/node_modules of its own (ADR 0098) -
      # npx rather than the pnpm --dir pattern the other apps above use.
      - id: prettier-brand
        name: prettier --write (apps/brand)
        entry: npx --yes prettier --write
        language: system
        files: ^apps/brand/.*\.(css|html)$
        pass_filenames: true

# Further language-specific hooks get added here alongside the next app
# that needs them - see docs/guides/adding-an-app.md.
