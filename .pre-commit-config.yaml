repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  # mypy needs the project's own dependencies (Pydantic plugin, stubs) on its
  # path, which the official pre-commit mirror doesn't give it without
  # duplicating them here - running it through the project's own toolchain
  # is the same reasoning as the ruff hooks above.
  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (apps/api)
        entry: uv run --directory apps/api mypy src
        language: system
        files: ^apps/api/src/.*\.py$
        pass_filenames: false

# Further language-specific hooks (biome, etc.) get added here alongside
# the next app that needs them - see docs/guides/adding-an-app.md.
